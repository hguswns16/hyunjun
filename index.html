<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026/2027 EPL 우승 예측</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #38003c; /* 프리미어리그 시그니처 보라색 */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #00ff85; /* 프리미어리그 시그니처 민트색 */
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            color: #e90052;
            font-weight: bold;
        }

        .btn-container {
            margin-bottom: 30px;
        }

        .predict-btn {
            background-color: #00ff85;
            color: #38003c;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 133, 0.4);
        }

        .predict-btn:hover {
            background-color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.6);
        }

        .result-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            display: none; /* 버튼 누르기 전에는 숨김 */
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background-color: rgba(0, 0, 0, 0.2);
            color: #00ff85;
            font-size: 1rem;
            text-transform: uppercase;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .rank {
            font-weight: bold;
            width: 10%;
        }

        .rank-1 { color: #ffd700; font-size: 1.2rem; } /* 1위 금색 */
        .rank-2 { color: #c0c0c0; } /* 2위 은색 */
        .rank-3 { color: #cd7f32; } /* 3위 동색 */

        .team-name {
            width: 50%;
            font-weight: 600;
        }

        .probability-bar-container {
            width: 40%;
        }

        .progress-bg {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #e90052, #00ff85);
            height: 100%;
            width: 0%;
            transition: width 1s ease-in-out;
        }

        .prob-text {
            font-size: 0.9rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1> Premier League</h1>
        <p>2026/2027 시즌 우승 예측 AI 슈퍼컴퓨터</p>
    </div>

    <div class="btn-container">
        <button class="predict-btn" onclick="showPredictions()">[우승확률보기]</button>
    </div>

    <div class="result-container" id="resultContainer">
        <table>
            <thead>
                <tr>
                    <th class="rank">순위</th>
                    <th class="team-name">팀명</th>
                    <th class="probability-bar-container">우승 확률</th>
                </tr>
            </thead>
            <tbody id="teamTableBody">
                <!-- 자바스크립트로 데이터가 여기에 삽입됩니다 -->
            </tbody>
        </table>
    </div>

    <script>
        // 2026/2027 시즌 가상의 예측 데이터 (팀명 및 예측 확률)
        const teamData = [
            { name: "맨체스터 시티", prob: 38.5 },
            { name: "아스날", prob: 24.2 },
            { name: "리버풀", prob: 18.0 },
            { name: "첼시", prob: 6.5 },
            { name: "토트넘 홋스퍼", prob: 4.1 },
            { name: "맨체스터 유나이티드", prob: 3.2 },
            { name: "뉴캐슬 유나이티드", prob: 2.5 },
            { name: "아스톤 빌라", prob: 1.2 },
            { name: "브라이튼", prob: 0.7 },
            { name: "웨스트햄 유나이티드", prob: 0.4 },
            { name: "본머스", prob: 0.2 },
            { name: "크리스탈 팰리스", prob: 0.1 },
            { name: "풀럼", prob: 0.1 },
            { name: "울버햄튼", prob: 0.08 },
            { name: "에버튼", prob: 0.05 },
            { name: "브렌트포드", prob: 0.03 },
            { name: "노팅엄 포레스트", prob: 0.02 },
            { name: "리스터 시티", prob: 0.01 },
            { name: "선더랜드", prob: 0.005 },
            { name: "리즈 유나이티드", prob: 0.005 }
        ];

        function showPredictions() {
            const container = document.getElementById('resultContainer');
            const tableBody = document.getElementById('teamTableBody');
            
            // 결과 창 표시
            container.style.display = 'block';
            tableBody.innerHTML = '';

            // 데이터를 순회하며 테이블 행(row) 생성
            teamData.forEach((team, index) => {
                const rank = index + 1;
                let rankClass = "";
                if (rank === 1) rankClass = "rank-1";
                else if (rank === 2) rankClass = "rank-2";
                else if (rank === 3) rankClass = "rank-3";

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="rank ${rankClass}">${rank}위</td>
                    <td class="team-name">${team.name}</td>
                    <td class="probability-bar-container">
                        <div><span class="prob-text">${team.prob}%</span></div>
                        <div class="progress-bg">
                            <div class="progress-fill" id="bar-${index}"></div>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);

                // 게이지 바 애니메이션 효과 (약간의 시차를 두고 차오름)
                setTimeout(() => {
                    const bar = document.getElementById(`bar-${index}`);
                    if(bar) {
                        // 확률이 너무 낮은 경우 최소 1% 길이는 보이도록 처리
                        const widthValue = team.prob < 0.5 ? Math.max(team.prob * 2, 1) : team.prob;
                        bar.style.width = widthValue + '%';
                    }
                }, 100);
            });

            // 버튼 누른 후 스무스 스크롤 효과
            container.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
